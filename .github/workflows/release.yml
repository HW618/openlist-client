name: Release

# Builds the clients when a release is published, and adds them to it.
# Tag the release v<version>, the version in nsgo.yaml: v0.2.0 for version 0.2.0.
on:
  release:
    types: [published]

permissions:
  contents: write # uploads the packages to the release

env:
  TAG: ${{ github.event.release.tag_name }}
  GH_TOKEN: ${{ github.token }}

jobs:
  # Android, Windows and Linux (amd64 and arm64) build on InstaBox machines: NSGo
  # needs only Go for them, and Go cross-compiles. instabox-medium is an Ubuntu 24.04
  # machine, made for the job and deleted after it. It needs the instabox GitHub App
  # installed for this repository (see README).
  build:
    name: ${{ matrix.name }}
    runs-on: instabox-medium
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Android arm64, target: android_arm64 }
          - { name: Windows x64, target: windows_x64, nsis: true }
          - { name: Linux x64 (amd64), target: linux_x64 }
          - { name: Linux arm64, target: linux_arm64 }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: The tag matches the version in nsgo.yaml
        run: |
          version=$(sed -n 's/^version:[[:space:]]*//p' nsgo.yaml | head -n 1 | tr -d "\"' ")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::The release is tagged $TAG but nsgo.yaml says version $version; the packages are named after the version."
            exit 1
          fi

      # The Windows installer is compiled by NSIS; without it the build leaves only its script.
      - name: Install NSIS
        if: matrix.nsis
        run: |
          sudo=""; [ "$(id -u)" -eq 0 ] || sudo="sudo"
          $sudo apt-get update
          $sudo apt-get install -y nsis

      # Android release signing: when the secrets below are set, write the keystore
      # and pass -keystore / -key-alias. Without them the APK keeps the debug key.
      # Secrets checklist (repository Settings → Secrets and variables → Actions):
      #   ANDROID_KEYSTORE_BASE64  — base64 of the PKCS#12 (.p12) or JKS keystore
      #   NSGO_KEYSTORE_PASSWORD   — keystore password (NSGo reads this env name)
      #   NSGO_KEY_PASSWORD        — key password (often the same as the keystore)
      #   ANDROID_KEY_ALIAS        — optional; defaults to openlist
      # Never commit the keystore or passwords; *.p12 / *.jks are gitignored.
      # Do not use `secrets.*` in `if:` — GitHub rejects that and the whole
      # workflow fails to load (no release builds). Check the env value in the shell.
      - name: Android release keystore
        id: android_sign
        if: matrix.target == 'android_arm64'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is unset; the APK will use the debug key."
            exit 0
          fi
          mkdir -p .nsgo
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > .nsgo/android-release.p12
          alias="${ANDROID_KEY_ALIAS:-openlist}"
          echo "keystore=.nsgo/android-release.p12" >> "$GITHUB_OUTPUT"
          echo "alias=$alias" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          NSGO_KEYSTORE_PASSWORD: ${{ secrets.NSGO_KEYSTORE_PASSWORD }}
          NSGO_KEY_PASSWORD: ${{ secrets.NSGO_KEY_PASSWORD }}
        run: |
          extra=()
          if [ -n "${{ steps.android_sign.outputs.keystore }}" ]; then
            extra+=(-keystore "${{ steps.android_sign.outputs.keystore }}" -key-alias "${{ steps.android_sign.outputs.alias }}")
          fi
          go tool nsgo build -target ${{ matrix.target }} "${extra[@]}"

      - name: Add the packages to the release
        run: |
          find dist/releases -maxdepth 1 -type f ! -name '.*' -print0 \
            | xargs -0 gh release upload "$TAG" --clobber

  # macOS needs Xcode, to compile and package and for the disk image, which an
  # InstaBox machine, being Linux, cannot have: this job runs on GitHub's own macOS runner.
  build-macos:
    name: macOS (arm64 and x64)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: The tag matches the version in nsgo.yaml
        run: |
          version=$(sed -n 's/^version:[[:space:]]*//p' nsgo.yaml | head -n 1 | tr -d "\"' ")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::The release is tagged $TAG but nsgo.yaml says version $version; the packages are named after the version."
            exit 1
          fi

      - name: Build
        run: go tool nsgo build -target macos_arm64,macos_x64

      - name: Add the packages to the release
        run: |
          find dist/releases -maxdepth 1 -type f ! -name '.*' -print0 \
            | xargs -0 gh release upload "$TAG" --clobber
