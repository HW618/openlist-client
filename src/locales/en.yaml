accessKeychainTitle: Can't keep your sign-in safely
accessKeychainDesc: This system has no Secret Service to keep it in. Install and start GNOME Keyring or KWallet (for example sudo apt install gnome-keyring), sign in to your desktop and choose Check again. Until then your sign-in is kept only until the app closes, and is never written to disk.
accessNotificationsTitle: Allow notifications
accessNotificationsDesc: OpenList can notify you when uploads, downloads or offline tasks finish or fail. Allow notifications so you do not have to keep watching the Transfers tab. iOS and Android usually ask only once; if you refuse, turn them on later in System Settings.
